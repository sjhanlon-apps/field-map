/* Layout: full-bleed map, floating category rail on top, draggable-feel bottom sheet with three heights */
:root{
  --bg:#f3f1ea; --surface:#fffdf8; --ink:#1d2421; --muted:#5f6a64; --line:rgba(29,36,33,.12);
  --accent:#0f6e56; --accent-ink:#ffffff; --shadow:0 10px 30px rgba(20,30,25,.18);
  --c-work:#4338ca; --c-cafe:#8a5a2b; --c-gym:#c2410c; --c-swim:#0e7490; --c-spa:#0f766e;
  --c-massage:#a21caf; --c-eat:#b45309; --c-health:#dc2626; --c-barber:#475569; --c-home:#1d2421;
  --tile-filter:none;
  --f:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2421; --ink:#eef1ec; --muted:#a3ada7; --line:rgba(238,241,236,.14);
  --accent:#34c79e; --accent-ink:#0b1210; --shadow:0 10px 30px rgba(0,0,0,.5);
  --c-work:#8b85ff; --c-cafe:#d29a62; --c-gym:#fb8a4c; --c-swim:#38bdf8; --c-spa:#2dd4bf;
  --c-massage:#e879f9; --c-eat:#fbbf24; --c-health:#f87171; --c-barber:#94a3b8; --c-home:#eef1ec;
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --ink:#eef1ec; --muted:#a3ada7; --line:rgba(238,241,236,.14);
  --accent:#34c79e; --accent-ink:#0b1210; --shadow:0 10px 30px rgba(0,0,0,.5);
  --c-work:#8b85ff; --c-cafe:#d29a62; --c-gym:#fb8a4c; --c-swim:#38bdf8; --c-spa:#2dd4bf;
  --c-massage:#e879f9; --c-eat:#fbbf24; --c-health:#f87171; --c-barber:#94a3b8; --c-home:#eef1ec;
  --tile-filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.92) saturate(.7);
  color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{font-family:var(--f);background:var(--bg)}
.leaflet-tile-pane{filter:var(--tile-filter)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.leaflet-control-zoom{display:none}

/* top rail */
.rail{position:fixed;left:0;right:0;top:0;z-index:600;padding-top:calc(env(safe-area-inset-top,0px) + 10px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.brand{display:flex;align-items:center;gap:8px;pointer-events:auto;width:max-content;max-width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;box-shadow:var(--shadow);margin-bottom:8px}
.brand b{font-weight:700;font-size:13px;letter-spacing:.01em}
.brand span{font-size:12px;color:var(--muted)}
.brand .dot{width:22px;height:22px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:12px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;pointer-events:auto;scrollbar-width:none;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:500 13px/1 var(--f);padding:9px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip small{color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.chip:focus-visible,.btn:focus-visible,.row:focus-visible,.fab:focus-visible,.handle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* floating buttons */
.fabs{position:fixed;z-index:600;right:max(12px,calc(env(safe-area-inset-right,0px) + 12px));display:flex;flex-direction:column;gap:8px;transition:bottom .25s ease}
.fab{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow);font:600 18px/1 var(--f);display:grid;place-items:center;cursor:pointer}
.fab svg{width:20px;height:20px}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--surface);border-top-left-radius:20px;border-top-right-radius:20px;
  box-shadow:0 -8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;transition:height .25s ease;
  padding-bottom:env(safe-area-inset-bottom,0px);max-width:560px;margin:0 auto}
.sheet[data-size="min"]{height:calc(64px + env(safe-area-inset-bottom,0px))}
.sheet[data-size="mid"]{height:calc(38% + env(safe-area-inset-bottom,0px))}
.sheet[data-size="max"]{height:calc(72% + env(safe-area-inset-bottom,0px))}
.handle{all:unset;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));position:relative}
.handle::before{content:"";position:absolute;top:6px;left:50%;width:38px;height:4px;margin-left:-19px;border-radius:4px;background:var(--line)}
.handle h2{margin:8px 0 0;font-size:16px;font-weight:700;text-wrap:balance}
.handle p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.handle .size{font-size:12px;color:var(--muted);white-space:nowrap;margin-top:8px}
.list{overflow-y:auto;flex:1;min-height:0;padding:0 max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.row{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;color:var(--ink);
  padding:11px 6px;border-bottom:1px solid var(--line);cursor:pointer;font:inherit}
.row .sw{width:12px;height:12px;border-radius:50%;margin-top:4px}
.row .nm{font-weight:600;font-size:14px;min-width:0}
.row .nt{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.row .ds{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.on{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px}

/* detail card */
.card{margin:4px 0 8px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.card .cat{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.card h3{margin:4px 0 2px;font-size:18px;font-weight:700;text-wrap:balance}
.card .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .note{font-size:14px;line-height:1.5;margin:8px 0 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:600 13px/1 var(--f);padding:11px 14px;border-radius:12px;border:1px solid var(--line);color:var(--ink);background:var(--surface);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn svg{width:16px;height:16px}

/* markers */
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;transition:transform .15s}
.pin b{transform:rotate(45deg);color:#fff;font:700 11px/1 var(--f)}
.pin.big{transform:rotate(-45deg) scale(1.35)}
.home{width:34px;height:34px;border-radius:12px;background:var(--c-home);color:var(--bg);display:grid;place-items:center;border:2px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.4);font:700 15px/1 var(--f)}
@media (min-width:900px){
  .sheet{left:auto;right:16px;bottom:16px;width:400px;border-radius:20px;margin:0}
  .sheet[data-size="mid"],.sheet[data-size="max"]{height:min(70%,640px)}
}
@media (prefers-reduced-motion:reduce){.sheet,.fabs,.pin{transition:none}}

.city{display:flex;gap:2px;background:var(--bg);border-radius:999px;padding:2px;margin-left:4px}
.city button{all:unset;cursor:pointer;font:600 12px/1 var(--f);padding:6px 10px;border-radius:999px;color:var(--muted)}
.city button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.city button:focus-visible{outline:2px solid var(--accent)}
.row .pr,.card .pr{font-size:12px;color:var(--ink);margin-top:3px;font-variant-numeric:tabular-nums}
.empty{padding:18px 6px;color:var(--muted);font-size:14px;line-height:1.5}

[hidden]{display:none!important}
.picker{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(20px,env(safe-area-inset-left,0px))}
.picker h1{margin:0 0 4px;font-size:28px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.picker p.lead{margin:0 0 10px;color:var(--muted);font-size:15px}
.citycard{all:unset;cursor:pointer;display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06);max-width:520px;width:100%;box-sizing:border-box}
.citycard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.citycard .fl{font-size:40px;line-height:1;text-align:center}
.citycard b{display:block;font-size:19px;font-weight:700}
.citycard span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.citycard em{font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.picker-inner{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
</style>
</head>
<body>
<div class="picker" id="picker" hidden>
  <div class="picker-inner">
    <h1>Where are you?</h1>
    <p class="lead">Pick a city. You can switch any time from the top bar.</p>
    <div id="cityCards" style="display:flex;flex-direction:column;gap:12px"></div>
  </div>
</div>
<div id="map" role="application" aria-label="Map of saved places"></div>

<div class="rail">
  <div class="brand"><div class="dot">S</div><b>Field Map</b>
    <div class="city" id="city" role="group" aria-label="Choose city"></div>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filter by category"></div>
</div>

<div class="fabs" id="fabs">
  <button class="fab" id="zin" aria-label="Zoom in">+</button>
  <button class="fab" id="zout" aria-label="Zoom out">−</button>
  <button class="fab" id="homeBtn" aria-label="Back to home base"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button>
  <button class="fab" id="fitBtn" aria-label="Show all places in this category"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<section class="sheet" id="sheet" data-size="mid" aria-label="Places list">
  <button class="handle" id="handle" aria-label="Resize list">
    <div><h2 id="sheetTitle">Everything</h2><p id="sheetSub"></p></div>
    <span class="size" id="sizeLbl">Show map ▾</span>
  </button>
  <div class="list" id="list"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="places.js"></script>
<script>
const CATS = {
  work:{label:"5-star & design",short:"W"}, cafe:{label:"Cafés",short:"C"}, gym:{label:"Gyms",short:"G"},
  swim:{label:"Swim",short:"S"}, spa:{label:"Spa & plunge",short:"✦"}, massage:{label:"Massage",short:"M"},
  eat:{label:"Eat",short:"E"}, barber:{label:"Barber",short:"B"}, health:{label:"Hospitals",short:"+"}
};
const CITIES = window.MAP_DATA.cities;
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const col=c=>css("--c-"+c);
function km(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dg=t(b.lng-a.lng);
  const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))*1.25;}
function short(d){return d<1?Math.round(d*1000/50)*50+" m":d.toFixed(1)+" km";}
function distLabel(d){ if(d<1.6) return `${short(d)} · ${Math.max(2,Math.round(d*13))} min walk`; return `${d.toFixed(1)} km · ~${Math.round(d*3.5+4)} min Grab`; }

const map=L.map("map",{zoomControl:false,minZoom:4,maxZoom:19});
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);

let cityKey, C, HOME, P, filter="all", selected=null;
const layer=L.layerGroup().addTo(map); let markers={}, homeMarker=null;
const chips=document.getElementById("chips"),list=document.getElementById("list"),sheet=document.getElementById("sheet");

function pinIcon(p,big){return L.divIcon({className:"",iconSize:[28,28],iconAnchor:[14,28],
  html:`<div class="pin${big?" big":""}" style="background:${col(p.cat)}"><b>${(CATS[p.cat]||{short:"•"}).short}</b></div>`});}
function catLabel(c){return (CATS[c]||{label:c}).label;}

function loadCity(key,fit){
  if(!CITIES[key]) key=Object.keys(CITIES)[0];
  cityKey=key; C=CITIES[key]; HOME=C.home; store.set("fm-city",key);
  if(location.hash.slice(1)!==key) history.replaceState(null,"","#"+key);
  P=(C.places||[]).map((r,i)=>Object.assign({id:i},r));
  const ref=HOME||{lat:C.center[0],lng:C.center[1]};
  P.forEach(p=>p.d=km(ref,p));
  layer.clearLayers(); markers={};
  P.forEach(p=>{markers[p.id]=L.marker([p.lat,p.lng],{icon:pinIcon(p),title:p.name,keyboard:true}).on("click",()=>select(p.id));});
  if(HOME){homeMarker=L.marker([HOME.lat,HOME.lng],{icon:L.divIcon({className:"",iconSize:[34,34],iconAnchor:[17,17],html:'<div class="home">⌂</div>'}),title:HOME.name,zIndexOffset:1000}).on("click",()=>select("home")); layer.addLayer(homeMarker);}
  filter=store.get("fm-filter-"+key)||"all"; if(filter!=="all"&&!P.some(p=>p.cat===filter))filter="all";
  selected=null;
  document.getElementById("city").innerHTML=Object.keys(CITIES).map(k=>`<button data-k="${k}" aria-pressed="${k===key}">${CITIES[k].flag||""} ${CITIES[k].short||CITIES[k].label}</button>`).join("");
  document.getElementById("picker").hidden=true;
  map.setView(C.center,C.zoom||14);
  apply(fit);
}
document.getElementById("city").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.k!==cityKey)loadCity(b.dataset.k,true);});
window.addEventListener("hashchange",()=>{const k=location.hash.slice(1);if(CITIES[k]&&k!==cityKey)loadCity(k,true);});

function renderChips(){
  const used=Object.keys(CATS).filter(k=>P.some(p=>p.cat===k));
  const all=[["all","Everything",P.length]].concat(used.map(k=>[k,CATS[k].label,P.filter(p=>p.cat===k).length]));
  chips.innerHTML=all.map(([k,l,n])=>`<button class="chip" data-k="${k}" aria-pressed="${k===filter}">${k==="all"?"":`<i style="background:${col(k)}"></i>`}${l} <small>${n}</small></button>`).join("");
}
chips.addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;filter=b.dataset.k;store.set("fm-filter-"+cityKey,filter);selected=null;apply(true);});

function visible(){return P.filter(p=>filter==="all"||p.cat===filter).sort((a,b)=>a.d-b.d);}
function gmaps(p){return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`+(p.pid?`&query_place_id=${p.pid}`:"");}
function dir(p,mode){return `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`+(p.pid?`&destination_place_id=${p.pid}`:"")+`&travelmode=${mode}`;}
const ICON_GO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l18-8-8 18-2-8z"/></svg>';
function card(p){
  if(p==="home") return `<div class="card"><div class="cat" style="color:var(--c-home)">Home base</div><h3>${esc(HOME.name)}</h3>
    <div class="meta">${esc(HOME.note||"")}</div><p class="note">Address for Grab: <span style="user-select:all">${esc(HOME.addr||"")}</span></p>
    <div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="${dir(HOME,"driving")}">${ICON_GO}Take me home</a></div></div>`;
  const mode=p.d<1.6?"walking":"driving";
  return `<div class="card"><div class="cat" style="color:${col(p.cat)}">${esc(catLabel(p.cat))}</div><h3>${esc(p.name)}</h3>
    ${p.price?`<div class="pr">${esc(p.price)}</div>`:""}
    <div class="meta">★ ${esc(p.rating)} · ${distLabel(p.d)} from ${HOME?esc(HOME.name.split(" ")[0]):"centre"}</div><p class="note">${esc(p.note)}</p>
    <div class="actions"><a class="btn primary" target="_blank" rel="noopener" href="${dir(p,mode)}">${ICON_GO}Directions from here</a>
    <a class="btn" target="_blank" rel="noopener" href="${gmaps(p)}">Photos & reviews</a></div></div>`;
}
function renderList(){
  const v=visible();
  document.getElementById("sheetTitle").textContent=(filter==="all"?"Everything":catLabel(filter))+" · "+C.label;
  document.getElementById("sheetSub").textContent=P.length?`${v.length} places · nearest first${HOME?" from "+HOME.name:""}`:(C.dates||"");
  if(!P.length){list.innerHTML=`<div class="empty">No ${esc(C.label)} spots yet. Ask Claude to add some, and they'll appear here.</div>`;return;}
  const sel=selected==null?"":card(selected==="home"?"home":P[selected]);
  list.innerHTML=sel+v.map(p=>`<button class="row${p.id===selected?" on":""}" data-id="${p.id}">
    <span class="sw" style="background:${col(p.cat)}"></span>
    <span style="min-width:0"><div class="nm">${esc(p.name)}</div>${p.price?`<div class="pr">${esc(p.price)}</div>`:""}<div class="nt">${esc(p.note)}</div></span>
    <span class="ds">${short(p.d)}</span></button>`).join("");
}
list.addEventListener("click",e=>{const r=e.target.closest(".row");if(r)select(+r.dataset.id);});

function apply(fit){
  renderChips();
  P.forEach(p=>{const on=filter==="all"||p.cat===filter;const m=markers[p.id];
    if(on&&!layer.hasLayer(m))layer.addLayer(m); if(!on&&layer.hasLayer(m))layer.removeLayer(m);
    m.setIcon(pinIcon(p,p.id===selected)); m.setZIndexOffset(p.id===selected?900:0);});
  renderList(); if(fit)fitVisible();
}
function bottomPad(){return sheet.getBoundingClientRect().height+12;}
function fitVisible(){
  let v=visible(); const near=v.filter(p=>p.d<5); if(near.length>=2) v=near;
  const pts=v.map(p=>[p.lat,p.lng]); if(HOME) pts.push([HOME.lat,HOME.lng]);
  if(pts.length<2){map.setView(pts[0]||C.center,C.zoom||14);return;}
  map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[24,120],paddingBottomRight:[24,bottomPad()],maxZoom:16});
}
function select(id){
  selected=id;
  if(id!=="home"&&filter!=="all"&&P[id].cat!==filter){filter=P[id].cat;store.set("fm-filter-"+cityKey,filter);}
  apply(false);
  if(sheet.dataset.size==="min")setSize("mid");
  const p=id==="home"?HOME:P[id]; const z=Math.max(map.getZoom(),15);
  const target=map.project([p.lat,p.lng],z).add([0,(bottomPad()-120)/2]);
  map.flyTo(map.unproject(target,z),z,{duration:.5});
  list.scrollTop=0;
}
const sizes=["min","mid","max"],lbl={min:"Show list ▴",mid:"Show map ▾",max:"Smaller ▾"};
function setSize(s){sheet.dataset.size=s;document.getElementById("sizeLbl").textContent=lbl[s];
  store.set("fm-size",s);setTimeout(()=>{document.getElementById("fabs").style.bottom=bottomPad()+"px";map.invalidateSize();},260);}
let swiped=false;
const handle=document.getElementById("handle");
handle.addEventListener("click",()=>{if(swiped){swiped=false;return;}const s=sheet.dataset.size;setSize(s==="mid"?"min":s==="min"?"max":"mid");});
let ty=null;handle.addEventListener("touchstart",e=>{ty=e.touches[0].clientY},{passive:true});
handle.addEventListener("touchend",e=>{if(ty==null)return;const dy=e.changedTouches[0].clientY-ty;ty=null;
  const i=sizes.indexOf(sheet.dataset.size);if(dy>30&&i>0){swiped=true;setSize(sizes[i-1]);}else if(dy<-30&&i<2){swiped=true;setSize(sizes[i+1]);}
  setTimeout(()=>{swiped=false},400);});
document.getElementById("zin").onclick=()=>map.zoomIn();
document.getElementById("zout").onclick=()=>map.zoomOut();
document.getElementById("homeBtn").onclick=()=>{if(HOME)select("home");else map.setView(C.center,C.zoom||14);};
document.getElementById("fitBtn").onclick=()=>fitVisible();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>apply(false));

const savedSize=store.get("fm-size"); setSize(sizes.includes(savedSize)?savedSize:"mid");
document.getElementById("cityCards").innerHTML=Object.keys(CITIES).map(k=>{const c=CITIES[k],n=(c.places||[]).length;
  return `<button class="citycard" data-k="${k}"><div class="fl">${c.flag||""}</div><div><b>${esc(c.label)}</b><span>${esc(c.country||"")} · ${esc(c.dates||"")}</span><span>${esc(c.blurb||"")}</span></div><em>${n?n+" spots":"Coming soon"}</em></button>`}).join("");
document.getElementById("cityCards").addEventListener("click",e=>{const b=e.target.closest(".citycard");if(!b)return;loadCity(b.dataset.k,false);setTimeout(()=>{document.getElementById("fabs").style.bottom=bottomPad()+"px";fitVisible();},200);});
document.querySelector(".brand .dot").style.cursor="pointer";
document.querySelector(".brand .dot").addEventListener("click",()=>{document.getElementById("picker").hidden=false;});
const startKey=location.hash.slice(1)||store.get("fm-city");
if(startKey&&CITIES[startKey]){loadCity(startKey,false);setTimeout(()=>{document.getElementById("fabs").style.bottom=bottomPad()+"px";fitVisible();},300);}
else{map.setView([10.7745,106.6905],13);document.getElementById("picker").hidden=false;}
</script>

</body>
</html>
